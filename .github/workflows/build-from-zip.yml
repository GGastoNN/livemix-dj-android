name: Compilar APK desde ZIP

on:
  push:
    branches: [main]
    paths:
      - livemix-dj-mvp.zip
      - .github/workflows/build-from-zip.yml
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar ZIP
        run: test -f livemix-dj-mvp.zip

      - name: Extraer proyecto
        run: |
          mkdir extracted-project
          unzip -q livemix-dj-mvp.zip -d extracted-project

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake con reintentos
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.0.12077973"
            if sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"; then
              test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"
              exit 0
            fi
            echo "Reintentando instalación NDK ($attempt/3)..."
          done
          exit 1

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        working-directory: extracted-project
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: livemix-debug-apk
          path: extracted-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
